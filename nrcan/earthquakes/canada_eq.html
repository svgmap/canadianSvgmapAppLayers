<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Earthquakes Canada</title>
    <style>
        body { font-family: sans-serif; font-size: 12px; padding: 5px; }
        .legend-color { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 1px solid #000; margin-right: 4px; vertical-align: middle; }
        .credit { font-size: 10px; margin-bottom: 10px; padding: 5px; background: #f9f9f9; border: 1px solid #ddd; line-height: 1.4; }
    </style>
    <script src="https://cdn.jsdelivr.net/gh/svgmap/svgmapjs@latest/svgMapLayerLib.js"></script>
    <script src="canada_eq.js"></script>
</head>
<body>
    <h4>Earthquakes Canada</h4>
    
    <!-- Credit based on Government of Canada Terms and Conditions -->
    <div class="credit">
        <strong>Credit / Source:</strong><br>
        This reproduction is a copy of the "Earthquakes Canada" data, authored by the Government of Canada.<br>
        The original version is available at: <br>
        <a href="https://www.earthquakescanada.nrcan.gc.ca/" target="_blank">https://www.earthquakescanada.nrcan.gc.ca/</a>
    </div>

    <div>
        <input type="button" id="reloadBtn" value="Reload Data">
    </div>
    
    <div id="messageDiv" style="font-size:11px; margin: 10px 0; color: blue;">
        <span id="statusMsg">Waiting...</span>
    </div>

    <div id="hanreiMag" style="width:100%; font-size:11px; margin-top: 10px;">
        <strong>Magnitude Legend:</strong><br>
        <div><span class="legend-color" style="background-color: #f2f2ff;"></span>&lt; M 1.0</div>
        <div><span class="legend-color" style="background-color: #00aaff;"></span>M 1.0 - 2.9</div>
        <div><span class="legend-color" style="background-color: #ffe600;"></span>M 3.0 - 4.9</div>
        <div><span class="legend-color" style="background-color: #ff2800;"></span>M 5.0 +</div>
    </div>
</body>
</html>
