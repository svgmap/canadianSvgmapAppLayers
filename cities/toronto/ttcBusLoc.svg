<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-180 -90 360 180" data-controller="ttcBusLoc.html#exec=appearOnLayerLoad&amp;requiredHeight=460" property="">
  <globalCoordinateSystem srsName="http://purl.org/crs/84" transform="matrix(1,0,0,-1,0,0)"/>
  <defs>
    <!-- バス用シンボル -->
    <g id="busMoving">
      <circle cx="0" cy="0" r="8" fill="#0878d1" stroke="#ffffff" stroke-width="1.8"/>
    </g>
    <g id="busStopped">
      <circle cx="0" cy="0" r="8" fill="#e87917" stroke="#ffffff" stroke-width="1.8"/>
    </g>

    <!-- 路面電車 (Streetcar) 用シンボル -->
    <g id="streetcarMoving">
      <rect x="-7.5" y="-7.5" width="15" height="15" rx="3" fill="#da291c" stroke="#ffffff" stroke-width="1.8"/>
    </g>
    <g id="streetcarStopped">
      <rect x="-7.5" y="-7.5" width="15" height="15" rx="3" fill="#e87917" stroke="#ffffff" stroke-width="1.8"/>
    </g>

    <!-- 共通状態シンボル -->
    <g id="vehicleStale">
      <circle cx="0" cy="0" r="8" fill="#777777" stroke="#ffffff" stroke-width="1.8"/>
    </g>
    <g id="vehicleSelection">
      <circle cx="0" cy="0" r="12" fill="none" stroke="#e0041d" stroke-width="3"/>
    </g>
  </defs>
  <g id="trails"/>  
  <g id="mapContents"></g>
</svg>
