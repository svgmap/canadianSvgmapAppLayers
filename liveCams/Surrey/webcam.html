<!doctype html>
<html property="title,camera_name,owner,image_url,comments">
	<head>
		<meta charset="UTF-8" />
		<title>Surrey Traffic Cameras (LaWA Layer)</title>
	</head>
	<script src="https://cdn.jsdelivr.net/gh/svgmap/svgmapjs@latest/svgMapLayerLib.js"></script>
	<script>
		// Description:
		//	Surrey City Live Cam Layer
		//
		// License: (MPL v2)
		// This Source Code Form is subject to the terms of the Mozilla Public
		// License, v. 2.0. If a copy of the MPL was not distributed with this
		// file, You can obtain one at https://mozilla.org/MPL/2.0/.

		// 設定: サレー市 公式GeoJSONエンドポイント (ArcGIS Replica Cache)
		const cameraListUrl =
			"https://services5.arcgis.com/YRpe0VKTJytZSSIB/arcgis/rest/services/Traffic%20Cameras/FeatureServer/replicafilescache/Traffic%20Cameras_-2063284353940510036.geojson";

		addEventListener("layerWebAppReady", async  function(){
			try {
				const response = await fetch(svgMap.getCORSURL(cameraListUrl));
				const rawData = await response.json(); // 最初からGeoJSON形式！

				// ダミーデータを弾いてプロパティを整理
				const gjs = cleanSurreyGeoJSON(rawData);
				console.log("Surrey Data Loaded:", gjs);

				const metaDict = [
					"title",
					"camera_name",
					"owner",
					"image_url",
					"comments",
				];

				const targetLayerID =
					typeof layerID !== "undefined" ? layerID : "surrey_cam_layer";
				svgMap.setShowPoiProperty(showSurreyProperty, targetLayerID);
				document.documentElement.setAttribute("property", metaDict.join(","));

				// サレー市はダークオレンジでプロット
				svgMapGIStool.drawGeoJson(
					gjs,
					targetLayerID,
					"darkorange",
					2,
					"white",
					"p4",
					"title",
					null,
					null,
					metaDict,
				);
				svgMap.refreshScreen();
			} catch (e) {
				console.error("Surrey Layer Load Error:", e);
			}
		});

		/**
		 * GeoJSONのクレンジング (nullデータの除去とプロパティの統一)
		 */
		function cleanSurreyGeoJSON(rawData) {
			const features = rawData.features
				.map((f) => {
					const p = f.properties; // ArcGISのattributesではなく標準のproperties

					// 画像URLが存在しないダミーや欠損レコードは除外する
					if (!p.IMAGE) return null;

					return {
						type: "Feature",
						geometry: f.geometry, // 最初から標準のPointオブジェクト
						properties: {
							title: p.LOCATION || p.CAMERA_NAME || "Surrey Traffic Cam",
							camera_name: p.CAMERA_NAME || "",
							owner: p.OWNER || "",
							image_url: p.IMAGE,
							comments: p.COMMENTS || "",
						},
					};
				})
				.filter((feature) => feature !== null);

			return {
				type: "FeatureCollection",
				features: features,
			};
		}

		/**
		 * クリック時のポップアップ表示 (トロント同様の直リンク・爆速表示)
		 */
		async function showSurreyProperty(target) {
			const metaSchema = document.documentElement
				.getAttribute("property")
				.split(",");
			const metaData = svgMap.parseEscapedCsvLine(
				target.getAttribute("content"),
			);

			const getData = (key) => metaData[metaSchema.indexOf(key)];

			const camName = getData("title");
			const liveCamUrl = getData("image_url");
			const ts = new Date().getTime();

			let message = `<div style="max-height:600px; overflow-y:auto; padding-right:5px; font-family: sans-serif;">`;

			// ヘッダー
			message += `
                <div style="font-size:16px; font-weight:bold; color:darkorange; margin-bottom:10px; border-bottom:3px solid darkorange; padding-bottom:5px;">
                    ${camName}
                </div>`;

			message += `<table border='1' style='font-size:11px; width:100%; border-collapse:collapse; border:solid darkorange;'>`;

			// ライブ画像エリア
			if (liveCamUrl) {
				const secureUrl = liveCamUrl.replace(/^http:\/\//i, "https://");
				message += `
                    <tr><td colspan="2" style="background:#000; padding:0; text-align:center;">
                        <a target="_blank" href="${secureUrl}">
                            <img src="${secureUrl}?t=${ts}" width="100%" style="display:block;" >
                        </a>
                    </td></tr>`;
			}

			// プロパティ詳細
			const ignoreKeys = ["title", "image_url"];
			metaData.forEach((itm, idx) => {
				const key = metaSchema[idx];
				if (!ignoreKeys.includes(key) && itm) {
					const displayVal = itm.startsWith("http")
						? `<a href="${itm}" target="_blank" style="color:darkorange; word-break:break-all;">${itm}</a>`
						: itm;
					message += `<tr><td style="background:#fff3cd; width:35%; padding:4px; font-weight:bold;">${key}</td><td style="padding:4px;">${displayVal}</td></tr>`;
				}
			});
			message += `</table>`;

			// 出典
			message += `
                <div style='font-size:9px; margin-top:10px; color:#555; line-height:1.2; padding:5px; border-top:1px dashed #ccc;'>
                    <b>Source:</b> Contains information from <a href="https://data.surrey.ca/" target="_blank">City of Surrey Open Data</a>.
                </div></div>`;

			svgMap.showModal(message, 450, 480);
		}
	</script>
	<body>
		<h4>Surrey City Live Cam Layer</h4>
		<div style="font-size: 12px; list-style-type: none; padding: 0">
			<li style="margin-bottom: 4px">
				Source:
				<a href="https://data.surrey.ca/" target="_blank"
					>City of Surrey Open Data</a
				>
			</li>
			<li style="margin-bottom: 4px">
				Icon:
				<img
					src="cam1.png"
					width="18"
					height="18"
					style="vertical-align: middle"
					onerror="this.style.display = 'none'"
				/>
			</li>
		</div>
	</body>
</html>
